<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot ให้คำปรึกษาการร่างคำฟ้อง</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    #mainContainer {
      max-width: 900px;
      margin: 30px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      padding: 20px;
      display: flex;
      flex-direction: row;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #robotImage {
      max-width: 100%;
      width: 250px;
      height: auto;
      border-radius: 10px;
      object-fit: contain;
      flex-shrink: 0;
    }

    #chatContainer {
      flex: 1 1 300px;
      max-width: 600px;
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin-top: 0;
      color: #333;
    }

    #chatBox {
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fafafa;
      margin-bottom: 10px;
    }

    .message {
      margin: 10px 0;
      padding: 10px 14px;
      border-radius: 20px;
      max-width: 75%;
      clear: both;
      word-wrap: break-word;
    }

    .user {
      background: #dcf8c6;
      float: right;
      text-align: right;
    }

    .bot {
      background: #e5e5ea;
      float: left;
    }

    #status {
      font-style: italic;
      color: gray;
      margin: 5px 0;
      height: 20px;
    }

    #inputContainer {
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex-grow: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    #sendBtn {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: white;
      cursor: pointer;
    }

    #sendBtn:hover {
      background: #45a049;
    }

    /* Responsive layout for mobile */
    @media (max-width: 768px) {
      #mainContainer {
        flex-direction: column;
        padding: 15px;
      }

      #robotImage {
        width: 100%;
        max-width: 100%;
        align-self: center;
      }

      #chatBox {
        height: 300px;
      }
    }
    footer {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
      text-align: center;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
    /* Hourglass Animation */
    .loading {
      display: inline-block;
      font-size: 24px;
      animation: rotateHourglass 1.2s linear infinite;
    }
    
    @keyframes rotateHourglass {
      0%   { transform: rotate(0deg); }
      50%  { transform: rotate(180deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div id="mainContainer">
  <img id="robotImage" src="./ict4.gif" alt="ICT4 Animation">

  <div id="chatContainer">    
    <h2>💬 AI ChatBot ให้คำปรึกษาการร่างคำฟ้อง</h2>
    <div id="chatBox"></div>
    <div id="status"></div>
    <div id="inputContainer">
      <input type="text" id="userInput" placeholder="พิมพ์คำถามของคุณ..." />
      <button id="sendBtn" onclick="sendMessage()">ส่ง</button>
    </div>
    <footer>
      <a href="https://infocenter.oic.go.th/สำนักงานอัยการสูงสุด/topic.php?gid=15124&mid=1017" class="btn" target="_blank">ศึกษาข้อมูลเพิ่มเติม</a>
      🚧 อยู่ระหว่างการพัฒนา กรุณาตรวจสอบข้อมูลอีกครั้งเพื่อความถูกต้อง<br>
      พัฒนาโดย <strong>SuperAnawat</strong> ทีม <strong>ICT4</strong>
    </footer>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="./config.js"></script>

<script>
  const chatBox = document.getElementById('chatBox');
  const status = document.getElementById('status');

  // ดึง URL จาก config.js โดยตรง แนะนำให้ใช้ websocket เพื่อประสิทธิภาพที่ดี
  const socket = io(CONFIG.API_URL, {
      transports: ["websocket", "polling"]
  });

  let currentBotDiv = null;

  socket.on("connect", () => {
      console.log("Connected to Backend successfully:", socket.id);
  });

  socket.on("connect_error", (error) => {
      console.error("Connection Error:", error);
      status.textContent = 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาตรวจสอบ URL';
  });

  socket.on("disconnect", () => {
      console.log("Disconnected");
  });

  function sendMessage() {
      const input = document.getElementById('userInput');
      const message = input.value.trim();

      if (!message) return;

      appendMessage(message, 'user');
      input.value = '';
      status.innerHTML = '<span class="loading">⌛</span>';
      currentBotDiv = null;

      // ส่งข้อความไป Flask SocketIO
      socket.emit("peopleChat", message);
  }

  // เริ่ม stream (AI กำลังเริ่มพิมพ์)
  socket.on("response_start", () => {
      currentBotDiv = document.createElement('div');
      currentBotDiv.className = 'message bot';
      currentBotDiv.innerHTML = '';
      chatBox.appendChild(currentBotDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
  });

  // รับข้อความทีละ chunk (Streaming)
  socket.on("response_stream", (data) => {
      if (!currentBotDiv) {
          currentBotDiv = document.createElement('div');
          currentBotDiv.className = 'message bot';
          chatBox.appendChild(currentBotDiv);
      }
      currentBotDiv.innerHTML += data.text;
      chatBox.scrollTop = chatBox.scrollHeight;
  });

  // จบ stream (ประมวลผลข้อความสุดท้ายให้สมบูรณ์ เช่น จัด Format หรือแปลง Markdown)
  socket.on("response_done", (data) => {
      if (currentBotDiv) {
          currentBotDiv.innerHTML = data.html;
      }
      status.textContent = '';
      chatBox.scrollTop = chatBox.scrollHeight;
  });

  // จัดการ Error กรณีระบบหลังบ้านมีปัญหา
  socket.on("response_error", (data) => {
      appendMessage("เกิดข้อผิดพลาดในการเชื่อมต่อ หรือระบบหลังบ้านขัดข้อง ⚠️", "bot");
      status.textContent = '';
  });

  // ฟังก์ชันช่วยเหลือสำหรับสร้างกล่องข้อความ
  function appendMessage(text, sender) {
      const div = document.createElement('div');
      div.className = 'message ' + sender;

      if (sender === 'bot') {
          div.innerHTML = text;
      } else {
          div.textContent = text;
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
  }

  // กด Enter เพื่อส่งข้อความ
  document.getElementById('userInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
          sendMessage();
      }
  });
</script>

</body>
</html>
