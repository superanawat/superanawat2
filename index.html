<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>AI Chatbot ช่วยสืบค้นหาร่างคำฟ้อง</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    #mainContainer {
      max-width: 900px;
      margin: 30px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      padding: 20px;
      display: flex;
      flex-direction: row;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #robotImage {
      max-width: 100%;
      width: 250px;
      height: auto;
      border-radius: 10px;
      object-fit: contain;
      flex-shrink: 0;
    }

    #chatContainer {
      flex: 1 1 300px;
      max-width: 600px;
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin-top: 0;
      color: #333;
    }

    #chatBox {
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fafafa;
      margin-bottom: 10px;
    }

    .message {
      margin: 10px 0;
      padding: 10px 14px;
      border-radius: 20px;
      max-width: 75%;
      clear: both;
      word-wrap: break-word;
    }

    .user {
      background: #dcf8c6;
      float: right;
      text-align: right;
    }

    .bot {
      background: #e5e5ea;
      float: left;
    }

    #status {
      font-style: italic;
      color: gray;
      margin: 5px 0;
      height: 20px;
    }

    #inputContainer {
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex-grow: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    #sendBtn {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: white;
      cursor: pointer;
    }

    #sendBtn:hover {
      background: #45a049;
    }

    /* ✅ Responsive layout for mobile */
    @media (max-width: 768px) {
      #mainContainer {
        flex-direction: column;
        padding: 15px;
      }

      #robotImage {
        width: 100%;
        max-width: 100%;
        align-self: center;
      }

      #chatBox {
        height: 300px;
      }
    }
    footer {
  margin-top: 20px;
  font-size: 14px;
  color: #666;
  text-align: center;
  border-top: 1px solid #eee;
  padding-top: 15px;
}
  </style>
</head>
<body>

<div id="mainContainer">
  <img id="robotImage" src="./ict4.gif" alt="ICT4 Animation">

  <div id="chatContainer">    
    <h2>💬 AI ChatBot ช่วยสืบค้นหาร่างคำฟ้อง</h2>
    <div id="chatBox"></div>
    <div id="status"></div>
    <div id="inputContainer">
      
      <input type="text" id="userInput" placeholder="พิมพ์คำถามของคุณ..." />
      <button id="sendBtn" onclick="sendMessage()">ส่ง</button>
    </div>
    <footer>
  <a href="https://www3.ago.go.th/center/lawaid/" class="btn" target="_blank">ศึกษาข้อมูลเพิ่มเติม</a>
  🚧 อยู่ระหว่างการพัฒนา กรุณาตรวจสอบข้อมูลอีกครั้งเพื่อความถูกต้อง<br>
  พัฒนาโดย <strong>SuperAnawat</strong> ทีม <strong>ICT4</strong>
  </footer>

  </div>
</div>

<script>
  const chatBox = document.getElementById('chatBox');
  const status = document.getElementById('status');

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const message = input.value.trim();
    if (!message) return;

    appendMessage(message, 'user');
    input.value = '';
    status.textContent = 'กำลังคิด...';

    try {
      const response = await fetch('https://6873-182-52-236-56.ngrok-free.app/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt: message,
          stream: false
        })
      });





      const data = await response.json();
      appendMessage(data.response || '[ไม่สามารถตอบได้]', 'bot');
    } catch (error) {
      appendMessage('[บอทยังไม่พร้อมให้บริการ]', 'bot');
      console.error(error);
    } finally {
      status.textContent = '';
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  }

  function appendMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'message ' + sender;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  document.getElementById('userInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
