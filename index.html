<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผู้ช่วยระบบการสืบค้นตัวอย่างร่างคำฟ้องคดีอาญา และคำร้องต่างๆ AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    #mainContainer {
      max-width: 900px;
      margin: 30px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      padding: 20px;
      display: flex;
      flex-direction: row;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #robotImage {
      max-width: 100%;
      width: 250px;
      height: auto;
      border-radius: 10px;
      object-fit: contain;
      flex-shrink: 0;
    }

    #chatContainer {
      flex: 1 1 300px;
      max-width: 600px;
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin-top: 0;
      color: #333;
    }

    #chatBox {
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fafafa;
      margin-bottom: 10px;
    }

    .message {
      margin: 10px 0;
      padding: 10px 14px;
      border-radius: 20px;
      max-width: 75%;
      clear: both;
      word-wrap: break-word;
    }

    .user {
      background: #dcf8c6;
      float: right;
      text-align: right;
    }

    .bot {
      background: #e5e5ea;
      float: left;
    }

    #status {
      font-style: italic;
      color: gray;
      margin: 5px 0;
      height: 20px;
    }

    #inputContainer {
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex-grow: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    #sendBtn {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: white;
      cursor: pointer;
    }

    #sendBtn:hover {
      background: #45a049;
    }

    #micBtn {
      padding: 10px 14px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #2196f3;
      color: white;
      cursor: pointer;
      flex-shrink: 0;
    }

    #micBtn:hover {
      background: #1976d2;
    }

    #micBtn.recording {
      background: #e53935;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(229,57,53,0.6); }
      70% { box-shadow: 0 0 0 10px rgba(229,57,53,0); }
      100% { box-shadow: 0 0 0 0 rgba(229,57,53,0); }
    }
    /* การตั้งค่าสำหรับไอคอนกำลังคิด (Typing Indicator) */
    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 0;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background-color: #888;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    /* หน่วงเวลาให้แต่ละจุดเด้งไม่พร้อมกัน */
    .typing-indicator span:nth-child(1) {
      animation-delay: -0.32s;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }

    /* Responsive layout for mobile */
    @media (max-width: 768px) {
      #mainContainer {
        flex-direction: column;
        padding: 15px;
      }

      #robotImage {
        width: 100%;
        max-width: 100%;
        align-self: center;
      }

      #chatBox {
        height: 300px;
      }
    }
    footer {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
      text-align: center;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
    .indicator {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: #ccc; /* สีเทา (ไม่ได้เชื่อมต่อ) */
    display: inline-block;
    margin-right: 5px;
    }
    .indicator.active {
        background-color: #4caf50; /* สีเขียว (กำลังเชื่อมต่อ) */
        box-shadow: 0 0 5px #4caf50;
    }
  </style>
</head>
<body>

<div id="mainContainer">
  <img id="robotImage" src="./ict4.gif" alt="ICT4 Animation">

  <div id="chatContainer">    
    <h2>💬ผู้ช่วยระบบการสืบค้นตัวอย่างร่างคำฟ้องคดีอาญา และคำร้องต่างๆ</h2>
    <div id="chatBox"></div>
    <div id="status"></div>
    <div id="inputContainer">
      <input type="text" id="userInput" placeholder="พิมพ์คำถามของคุณ..." />
      <button id="micBtn" onclick="toggleVoiceInput()" title="พูดเพื่อพิมพ์">🎤</button>
      <button id="sendBtn" onclick="sendMessage()">ส่ง</button>
    </div>
    [พิมพ์คำถามด้วยแป้นพิมพ์หรือไมโครโฟน แล้วกดส่ง...]

    <footer>
    <div id="serverStatus" style="margin-bottom: 10px; display: flex; gap: 10px; align-items: center; font-size: 14px; color: #555;">
    สถานะเครื่อง:
    <div id="status-0" class="indicator">N1</div>
    <div id="status-1" class="indicator">N2</div>
    </div>
      <a href="https://www.ocs.go.th/searchlaw-law/" class="btn" target="_blank">ศึกษาข้อมูลเพิ่มเติม</a>
      🚧 อยู่ระหว่างการพัฒนา กรุณาตรวจสอบข้อมูลอีกครั้งเพื่อความถูกต้อง<br>
      พัฒนาโดย ทีม <strong>ICT4</strong>
    </footer>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="./config.js"></script>

<script>
  const chatBox = document.getElementById('chatBox');
  const status = document.getElementById('status');

// 1. ฟังก์ชันเลือกเครื่อง (รักษา Session เดิม) - [คงไว้เหมือนเดิม]
// ใน index.html หาบรรทัดที่ประกาศ const socket และเปลี่ยนเป็นแบบนี้:

// ฟังก์ชันดึง URL จาก Array
function getPersistentBackend() {
    let assignedBackend = localStorage.getItem('sarabot_backend_affinity');
    
    if (!assignedBackend || !CONFIG.API_URLS.includes(assignedBackend)) {
        const randomIndex = Math.floor(Math.random() * CONFIG.API_URLS.length);
        assignedBackend = CONFIG.API_URLS[randomIndex];
        localStorage.setItem('sarabot_backend_affinity', assignedBackend);
    }
    return assignedBackend;
}
  function updateServerUI() {
    const activeUrl = getPersistentBackend(); // ดึงเครื่องที่ใช้อยู่ปัจจุบัน
    const indicators = document.querySelectorAll('.indicator');
    
    // ตรวจสอบเครื่องที่ 1 และ 2
    CONFIG.API_URLS.forEach((url, index) => {
        const el = document.getElementById(`status-${index}`);
        if (el) {
            if (url === activeUrl) {
                el.classList.add('active'); // ถ้าใช่เครื่องที่ต่ออยู่ ให้เป็นสีเขียว
            } else {
                el.classList.remove('active'); // ถ้าไม่ใช่ ให้เป็นสีเทา
            }
        }
    });
}

// เรียกใช้ฟังก์ชันนี้หลังจากหน้าที่โหลดเสร็จ
updateServerUI();

// สร้าง Socket
const socket = io(getPersistentBackend(), {
    transports: ["websocket", "polling"]
});

  console.log("กำลังเชื่อมต่อไปที่:", getPersistentBackend()); // เพิ่มบรรทัดนี้
  // 3. รวมเหตุการณ์ทั้งหมดไว้ที่นี่
  socket.on("connect", () => {
      console.log("Connected to Backend successfully:", socket.id);
  });

  // ดักจับ Error ไว้ในฟังก์ชันนี้เท่านั้น
  socket.on("connect_error", (error) => {
      console.error("Connection Error:", error);
      status.textContent = 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้...';
      
      // Failover Logic: ตรวจสอบและย้ายเครื่องเมื่อเกิดข้อผิดพลาด
      const userConfirmed = confirm(
          "⚠️ ระบบตรวจพบปัญหาการเชื่อมต่อกับเครื่องปัจจุบัน\n" +
          "จำเป็นต้องย้ายไปเชื่อมต่อเครื่องใหม่\n" +
          "ซึ่งจะทำให้ประวัติการสนทนาเดิมหายไป\n\n" +
          "กด 'ตกลง' เพื่อรีโหลดและเชื่อมต่อใหม่"
      );

      if (userConfirmed) {
          localStorage.removeItem('sarabot_backend_affinity'); // ลบค่าเก่าทิ้ง
          location.reload(); // รีโหลดหน้าใหม่
      }
  });

  socket.on("disconnect", () => {
      console.log("Disconnected");
  });

  function sendMessage() {
      const input = document.getElementById('userInput');
      const message = input.value.trim();

      if (!message) return;

      appendMessage(message, 'user');
      input.value = '';
      // เปลี่ยนบรรทัดนี้ จาก status.textContent = 'กำลังคิด...';
      status.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
      currentBotDiv = null;

      // ส่งข้อความไป Flask SocketIO
      socket.emit("peopleChat", message);
  }

  // เริ่ม stream (AI กำลังเริ่มพิมพ์)
  socket.on("response_start", () => {
      currentBotDiv = document.createElement('div');
      currentBotDiv.className = 'message bot';
      currentBotDiv.innerHTML = '';
      chatBox.appendChild(currentBotDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
  });

  // รับข้อความทีละ chunk (Streaming)
  socket.on("response_stream", (data) => {
      if (!currentBotDiv) {
          currentBotDiv = document.createElement('div');
          currentBotDiv.className = 'message bot';
          chatBox.appendChild(currentBotDiv);
      }
      currentBotDiv.innerHTML += data.text;
      chatBox.scrollTop = chatBox.scrollHeight;
  });

  // จบ stream (ประมวลผลข้อความสุดท้ายให้สมบูรณ์ เช่น จัด Format หรือแปลง Markdown)
  socket.on("response_done", (data) => {
      if (currentBotDiv) {
          currentBotDiv.innerHTML = data.html;
      }
      // ล้างแอนิเมชันออกเมื่อตอบเสร็จ
      status.innerHTML = '';
      chatBox.scrollTop = chatBox.scrollHeight;
  });

  // จัดการ Error กรณีระบบหลังบ้านมีปัญหา
  socket.on("response_error", (data) => {
      appendMessage("เกิดข้อผิดพลาดในการเชื่อมต่อ หรือระบบหลังบ้านขัดข้อง ⚠️", "bot");
      // ล้างแอนิเมชันออกเมื่อเกิด Error
      status.innerHTML = '';
  });

  // ฟังก์ชันช่วยเหลือสำหรับสร้างกล่องข้อความ
  function appendMessage(text, sender) {
      const div = document.createElement('div');
      div.className = 'message ' + sender;

      if (sender === 'bot') {
          div.innerHTML = text;
      } else {
          div.textContent = text;
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
  }

  // กด Enter เพื่อส่งข้อความ
  document.getElementById('userInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
          sendMessage();
      }
  });

  // ===== ฟีเจอร์พิมพ์ด้วยเสียง (Web Speech API) =====
  const micBtn = document.getElementById('micBtn');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isRecording = false;

  if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'th-TH';       // ตั้งภาษาไทยเป็นหลัก
      recognition.continuous = false;   // หยุดเองเมื่อพูดจบ
      recognition.interimResults = true; // แสดงผลระหว่างพูดด้วย (ยังไม่ final)

      recognition.onstart = () => {
          isRecording = true;
          micBtn.classList.add('recording');
          status.textContent = '🎙️ กำลังฟัง... พูดได้เลย';
      };

      recognition.onresult = (event) => {
          let transcript = '';
          for (let i = 0; i < event.results.length; i++) {
              transcript += event.results[i][0].transcript;
          }
          document.getElementById('userInput').value = transcript;
      };

      recognition.onerror = (event) => {
          console.error('Speech recognition error:', event.error);
          if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
              status.textContent = '⚠️ กรุณาอนุญาตให้ใช้ไมโครโฟน';
          } else if (event.error === 'no-speech') {
              status.textContent = '⚠️ ไม่ได้ยินเสียงพูด ลองใหม่อีกครั้ง';
          } else {
              status.textContent = '⚠️ เกิดข้อผิดพลาดในการรับเสียง';
          }
      };

      recognition.onend = () => {
          isRecording = false;
          micBtn.classList.remove('recording');
          if (status.textContent.includes('กำลังฟัง')) {
              status.textContent = '';
          }
      };
  } else {
      // เบราว์เซอร์ไม่รองรับ (เช่น Firefox บาง version) ให้ซ่อนปุ่มไมค์
      micBtn.style.display = 'none';
      console.warn('เบราว์เซอร์นี้ไม่รองรับ Web Speech API');
  }

  function toggleVoiceInput() {
      if (!recognition) return;
      if (isRecording) {
          recognition.stop();
      } else {
          document.getElementById('userInput').value = '';
          recognition.start();
      }
  }
</script>

</body>
</html>
